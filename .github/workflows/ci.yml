name: Integração contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: docflow_test
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docflow -d docflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://docflow:docflow_test@localhost:5432/docflow_test
      JWT_SECRET: ci-only-secret-not-used-outside-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verificar lint do backend
        run: ruff check .
      - name: Migrations
        run: alembic upgrade head && alembic check
      - name: Executar testes do backend
        env:
          DATABASE_URL: sqlite:///./ci-tests.db
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verificar lint do frontend
        run: npm run lint
      - name: Verificar formatação com Prettier
        run: npm run format
      - name: Executar testes do frontend
        run: npm test
      - name: Gerar build do frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar DocFlow
        run: docker compose up --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Executar fluxos Playwright
        run: npm run e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > docker-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            docker-compose.log
